<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deck &middot; Bernardo Blom</title>
  <meta name="description" content="Client presentation deck by Bernardo Blom. Access on request." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="theme-color" content="#000000" />
  <meta name="color-scheme" content="dark" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="nav.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      color-scheme: dark;
      --raised: #141414;       /* chips, tags and logo plates: one step above the cards */
      --raised-2: #1c1c1c;
      --text-2: #a9a9b0;
      --border-strong: #333333;
      --nav-bg: rgba(0,0,0,.7);
      --bg: #000000;
      --bg-alt: #0a0a0a;
      --text: #ececec;
      --muted: #a3a3ab;        /* darkened for AA contrast on light bg */
      --accent: #00a877;       /* decorative only */
      --accent-text: #35d3a2;  /* text-safe green, 4.5:1 or better */
      --accent-blue: #d4d4da;
      --border: #222222;
      --ease: cubic-bezier(.22,.61,.36,1);
      --shadow-card: 0 20px 56px rgba(0,0,0,.55);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow-x: hidden;
    }

    img { max-width: 100%; -webkit-user-drag: none; user-select: none; }

    /* ── SHARED ──────────────────────────── */
    .wrap { max-width: var(--max-w); margin: 0 auto; padding: 0 var(--edge); }
    .section-pad { padding-top: clamp(64px, 9vw, 100px); padding-bottom: clamp(64px, 9vw, 100px); }
    .label { font-size: 11px; font-weight: 500; letter-spacing: .4px; color: var(--accent-text); margin-bottom: 14px; }
    .section-h2 { font-size: clamp(28px, 4vw, 44px); font-weight: 400; letter-spacing: -.035em; line-height: 1.05; color: var(--text); margin-bottom: clamp(36px, 5vw, 52px); }

    /* ── PROJECTS ────────────────────────── */
    #work { padding-top: clamp(64px, 9vw, 100px); padding-bottom: clamp(64px, 9vw, 100px); }

    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    @media (max-width: 1000px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }

    .card {
      cursor: pointer; overflow: hidden;
      background: var(--bg-alt); border: 1px solid var(--border);
      text-decoration: none; display: block;
      transition: transform .25s cubic-bezier(.22,.61,.36,1), box-shadow .25s;
      -webkit-tap-highlight-color: transparent;
    }
    .card:hover { transform: translateY(-5px); box-shadow: var(--shadow-card); }
    .card-thumb-wrap { width: 100%; aspect-ratio: 16/9; overflow: hidden; background: var(--bg-alt); }
    .card-thumb { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .4s cubic-bezier(.22,.61,.36,1); }
    .card:hover .card-thumb { transform: scale(1.04); }
    .card-thumb.broken { opacity: 0; }
    .card-body   { padding: 16px 18px 18px; }
    .card-year   { font-size: 11px; font-weight: 500; color: var(--muted); margin-bottom: 3px; }
    .card-name   { font-size: 14px; font-weight: 400; color: var(--text); letter-spacing: -.3px; line-height: 1.2; }
    .card-cat    { font-size: 12px; color: var(--muted); margin-top: 3px; }

    /* ── PRESENTATION DECKS ──────────────── */
    .deck-group + .deck-group { margin-top: clamp(44px, 6vw, 68px); }
    .deck-group-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    .deck-client { font-size: clamp(19px, 2vw, 24px); font-weight: 400; letter-spacing: -.035em; color: var(--text); }
    .deck-count { font-size: 11px; font-weight: 500; letter-spacing: .4px; color: var(--muted); }
    .deck-group-note { font-size: 13.5px; color: var(--muted); line-height: 1.7; max-width: 640px; margin: 8px 0 22px; }
    /* the same three-column, 12px-gap rhythm as the home page grids */
    .deck-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    @media (max-width: 1000px) { .deck-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 640px) { .deck-grid { grid-template-columns: 1fr; } }

    /* the cover is artwork, not a crop: show the whole slide */
    .deck .card-thumb-wrap { background: var(--bg); border-bottom: 1px solid var(--border); }
    .deck .card-thumb { object-fit: contain; }
    .deck-desc { font-size: 13px; color: var(--muted); line-height: 1.65; margin-top: 9px; }
    .deck-foot {
      display: flex; align-items: center; gap: 7px;
      margin-top: 13px; font-size: 12px; font-weight: 500; color: var(--text);
    }
    .deck-foot svg { transition: transform .2s; }
    .deck[target] .deck-foot svg { transition: transform .2s; }
    .deck[target]:hover .deck-foot svg { transform: translate(2px, -2px); }
    .deck:not([target]):hover .deck-foot svg { transform: translateX(3px); }

    /* access gate in front of the decks */
    .deck-gate {
      border: 1px solid var(--border);
      background: var(--bg-alt);
      padding: clamp(30px, 4vw, 52px);
      max-width: 520px;
    }
    .deck-gate-icon {
      display: grid; place-items: center;
      width: 42px; height: 42px;
      background: var(--bg); border: 1px solid var(--border); color: var(--muted);
      margin-bottom: 18px;
    }
    .deck-gate h3 { font-size: 19px; font-weight: 400; letter-spacing: -.03em; color: var(--text); }
    .deck-gate p { font-size: 13.5px; color: var(--muted); line-height: 1.7; margin-top: 8px; }
    .deck-gate-form { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
    .deck-gate-input {
      flex: 1; min-width: 160px;
      font-family: inherit; font-size: 14px; color: var(--text);
      padding: 12px 15px;
      border: 1.5px solid var(--border); background: var(--bg);
      transition: border-color .2s;
    }
    .deck-gate-input:focus { outline: none; border-color: var(--text); }
    .deck-gate-btn {
      font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer;
      padding: 12px 22px;
      border: 1.5px solid var(--text); background: var(--text); color: var(--bg);
      transition: opacity .2s;
    }
    .deck-gate-btn:hover { opacity: .85; }
    .deck-gate-err { font-size: 12.5px; color: #e8a15d; margin-top: 12px; }
    .deck-gate.shake { animation: deck-shake .3s; }
    @keyframes deck-shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    @media (prefers-reduced-motion: reduce) { .deck-gate.shake { animation: none; } }

    /* ── FOOTER ──────────────────────────── */
    footer {
      border-top: 1px solid var(--border);
      padding: 28px var(--edge);
      display: flex; justify-content: space-between; align-items: center;
      max-width: var(--max-w); margin: 0 auto;
    }
    footer p { font-size: 13px; color: var(--muted); }
    .dv-head { margin-bottom: clamp(30px, 4vw, 44px); }
    .dv-back {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 13px; font-weight: 500; color: var(--muted);
      text-decoration: none; transition: color .2s; margin-bottom: 20px;
    }
    .dv-back:hover { color: var(--text); }
    .dv-back svg { transition: transform .2s; }
    .dv-back:hover svg { transform: translateX(-3px); }
    .dv-client { font-size: 13px; font-weight: 500; color: var(--accent-text); }
    .dv-title {
      font-size: clamp(28px, 4vw, 44px); font-weight: 400;
      letter-spacing: -.035em; line-height: 1.05; margin: 10px 0 0;
    }
    .dv-meta { font-size: 12px; font-weight: 500; color: var(--muted); margin-top: 10px; }
    .dv-desc { font-size: 14px; color: var(--muted); line-height: 1.7; margin-top: 16px; max-width: 62ch; }

    .dv-slides { display: flex; flex-direction: column; gap: 12px; }
    .dv-slide {
      width: 100%; overflow: hidden;
      background: var(--bg-alt); border: 1px solid var(--border);
      position: relative;
    }
    .dv-slide img { display: block; width: 100%; height: auto; }
    .dv-num {
      position: absolute; left: 12px; top: 12px;
      font-size: 11px; font-weight: 500; color: var(--text);
      background: rgba(20,20,20,.88); backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      padding: 3px 10px; font-variant-numeric: tabular-nums;
      opacity: 0; transition: opacity .2s;
    }
    .dv-slide:hover .dv-num { opacity: 1; }

    .dv-notfound { padding: 40px 0; }
    .dv-notfound h2 { font-size: 26px; font-weight: 400; letter-spacing: -.03em; }
    .dv-notfound p { font-size: 14px; color: var(--muted); margin-top: 8px; }
    .dv-notfound a { color: var(--accent-text); text-decoration: none; font-size: 13px; font-weight: 500; }

    /* the page leads with the decks, so it needs the nav clearance itself */
    .decks-page { padding-top: calc(var(--nav-h) + 56px); }
  </style>

    document.documentElement.classList.add('js');
  </script>

  <script>
    function ep(raw) {
      if (raw.startsWith('http')) return raw;
      return raw.split('/').map(encodeURIComponent).join('/');
    }

    const view = document.getElementById('deckView');
    const id   = new URLSearchParams(location.search).get('id');
    const deck = DECK_INDEX[id];

    function renderDeck(instant) {
      if (!deck) {
        view.innerHTML = `
          <div class="dv-notfound">
            <h2>Deck not found</h2>
            <p>This deck doesn&rsquo;t exist or the link is incorrect.</p>
            <a href="decks.html">&larr; Back to all decks</a>
          </div>`;
        return;
      }
      document.title = deck.title + ' \u00b7 Bernardo Blom';

      const slides = Array.from({ length: deck.pages }, (_, i) => {
        const n = String(i + 1).padStart(2, '0');
        return `<div class="dv-slide">
            <img src="${ep(deck.dir + '/page-' + n + '.png')}"
                 alt="${deck.title}, slide ${i + 1}"
                 loading="${i < 2 ? 'eager' : 'lazy'}" />
            <span class="dv-num">${i + 1} / ${deck.pages}</span>
          </div>`;
      }).join('');

      view.innerHTML = `
        <div class="dv-head">
          <a class="dv-back" href="decks.html">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <path d="M12 7H2M6 2.5L2 7l4 4.5" stroke="currentColor" stroke-width="1.6"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            All decks
          </a>
          <p class="dv-client">${deck.client}</p>
          <h1 class="dv-title">${deck.title}</h1>
          <p class="dv-meta">${deck.meta}</p>
          <p class="dv-desc">${deck.desc}</p>
        </div>
        <div class="dv-slides">${slides}</div>`;

    }

    // the index page is gated, so the viewer has to be too, or the slides
    // would be reachable by typing the deck URL directly
    if (deckUnlocked()) renderDeck(false);
    else renderDeckGate(view, () => renderDeck(true));


  </script>
