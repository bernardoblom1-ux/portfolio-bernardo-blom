<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Project · Bernardo Blom</title>
  <meta name="robots" content="noindex, follow" />

  <link rel="apple-touch-icon" href="apple-touch-icon.png" />

  <!-- seo:end -->

  <link rel="stylesheet" href="nav.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      color-scheme: dark;
      --raised: #141414;       /* chips, tags and logo plates: one step above the cards */
      --raised-2: #1c1c1c;
      --text-2: #a9a9b0;
      --border-strong: #333333;
      --nav-bg: rgba(0,0,0,.7);
      --bg: #000000;
      --bg-alt: #0a0a0a;
      --text: #ececec;
      --muted: #a3a3ab;
      --accent: #00a877;       /* decorative only */
      --accent-text: #35d3a2;  /* text-safe green, 4.5:1 or better */
      --border: #222222;
      /* dark surfaces behind the style guide and the live preview.
         The style guide SVGs draw white and #DCDBE6 straight onto --panel,
         so it has to stay a dark surface (now near black): don't take it past ~#3a3a3a. */
      --panel: #141414;
      --panel-2: #1c1c1c;
      --panel-line: #2a2a2a;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg); color: var(--text);
      line-height: 1.6; -webkit-font-smoothing: antialiased;
    }

    /* ── LAYOUT ──────────────────────────── */
    .page {
      max-width: var(--max-w); margin: 0 auto;
      padding: calc(var(--nav-h) + 64px) var(--edge) 120px;
    }

    /* ── HEADER ──────────────────────────── */
    .project-header { margin-bottom: 56px; }

    .back-link {
      display: inline-flex; align-items: center; gap: 8px; margin-bottom: 28px;
      font-size: 13px; font-weight: 500; color: var(--muted); text-decoration: none; transition: color .2s;
    }
    .back-link:hover { color: var(--text); }
    .back-link svg { width: 16px; height: 16px; transition: transform .2s; }
    .back-link:hover svg { transform: translateX(-3px); }
    .project-meta { display: flex; align-items: baseline; flex-wrap: wrap; column-gap: 8px; margin-bottom: 14px; }
    .meta-year { font-size: 13px; font-weight: 500; color: var(--muted); }
    .meta-cat  { font-size: 13px; font-weight: 600; color: var(--accent-text); }

    .project-title {
      font-size: clamp(36px, 6vw, 80px); font-weight: 800;
      letter-spacing: -2.5px; line-height: .95; color: var(--text); margin-bottom: 22px;
    }
    .project-desc { font-size: clamp(15px, 1.4vw, 17px); color: var(--muted); line-height: 1.75; max-width: 640px; }

    .project-link {
      display: inline-flex; align-items: center; gap: 10px;
      margin-top: 28px; padding: 14px 22px;
      font-size: 13px; font-weight: 500; letter-spacing: .3px;
      color: var(--text); background: var(--bg);
      border: 1.5px solid var(--text); text-decoration: none;
      transition: background .2s, color .2s, border-color .2s;
    }
    .project-link:hover { background: var(--text); border-color: var(--text); color: var(--bg); }
    .project-link svg { transition: transform .2s; }
    .project-link:hover svg { transform: translate(2px, -2px); }

    /* ── STYLE GUIDE ─────────────────────── */
    .sg { display: flex; flex-direction: column; gap: clamp(48px, 6vw, 80px); margin-bottom: clamp(56px, 7vw, 88px); }
    .sg-head { display: flex; align-items: baseline; gap: 14px; }
    .sg-title { font-size: clamp(19px, 2vw, 24px); font-weight: 700; letter-spacing: -.6px; }
    .sg-note { font-size: 14px; color: var(--muted); line-height: 1.7; max-width: 620px; margin: 10px 0 20px; }

    .sg-panel {
      background: var(--panel); overflow: hidden;
      padding: clamp(24px, 3.5vw, 48px);
    }
    .sg-stack { display: flex; flex-direction: column; align-items: center; gap: clamp(28px, 4vw, 48px); }
    /* the vectors carry the design's own pixel scale, so they render 1:1 and only shrink */
    .sg-panel img { display: block; width: auto; max-width: 100%; height: auto; }

    .icon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 10px; }
    .icon-cell {
      aspect-ratio: 1; display: grid; place-items: center;
      background: var(--panel-2); border: 1px solid var(--panel-line);
      color: #fff; transition: color .25s, border-color .25s, transform .25s;
    }
    .icon-cell:hover { color: #6C2EF3; border-color: #6C2EF3; transform: translateY(-3px); }

    /* the segment picker, rebuilt as live components so the labels are real text */
    .chip-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
    .chip {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 14px; background: #fff;
      box-shadow: inset 0 0 0 1.5px #fff;
      transition: box-shadow .25s, transform .25s;
    }
    .chip-icon {
      display: grid; place-items: center; flex-shrink: 0;
      width: 34px; height: 34px;
      background: #EDE7FE; color: #6C2EF3;
      transition: background .25s, color .25s;
    }
    .chip-label {
      font-size: 13px; font-weight: 500; letter-spacing: -.1px; color: #1b1b1b;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .chip:hover { box-shadow: inset 0 0 0 1.5px #6C2EF3; transform: translateY(-2px); }
    .chip:hover .chip-icon { background: #6C2EF3; color: #fff; }

    .sg-legend { display: flex; gap: 20px; margin-top: 14px; font-size: 12px; color: var(--muted); }
    .sg-legend span { display: inline-flex; align-items: center; gap: 7px; }
    .sg-legend i { width: 6px; height: 6px; background: var(--muted); }
    .sg-legend span:last-child i { background: #6C2EF3; }

    /* ── LIVE EMBED ──────────────────────── */
    .embed { margin-bottom: clamp(56px, 7vw, 88px); }
    .embed-head { display: flex; align-items: baseline; gap: 14px; }
    .embed-title { font-size: clamp(19px, 2vw, 24px); font-weight: 700; letter-spacing: -.6px; }
    .embed-note { font-size: 14px; color: var(--muted); line-height: 1.7; max-width: 620px; margin: 10px 0 20px; }

    .embed-shell {
      background: var(--panel); overflow: hidden;
      border: 1px solid var(--panel-line);
    }

    /* browser chrome */
    .embed-bar {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 14px; background: var(--panel-2); border-bottom: 1px solid var(--panel-line);
    }
    .embed-dots { display: flex; gap: 6px; flex-shrink: 0; }
    .embed-dots i { width: 10px; height: 10px; background: #4d4d4d; }
    .embed-url {
      flex: 1; min-width: 0;
      display: flex; align-items: center; gap: 7px;
      padding: 6px 12px; background: var(--panel); border: 1px solid var(--panel-line);
      font-size: 11.5px; color: #9b9b9b; letter-spacing: .2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .embed-url svg { flex-shrink: 0; color: #6e6e6e; }
    .embed-tools { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .embed-vp {
      display: flex; padding: 3px; background: var(--panel);
      border: 1px solid var(--panel-line);
    }
    .embed-vp button {
      display: grid; place-items: center;
      width: 30px; height: 26px; border: none;
      background: transparent; color: #8a8a8a; cursor: pointer;
      transition: background .2s, color .2s;
    }
    .embed-vp button:hover { color: #d4d4d4; }
    .embed-vp button[aria-pressed="true"] { background: #4a4a4a; color: #fff; }
    .embed-new {
      display: grid; place-items: center;
      width: 32px; height: 32px;
      border: 1px solid var(--panel-line); background: var(--panel); color: #8a8a8a;
      text-decoration: none; transition: color .2s, border-color .2s;
    }
    .embed-new:hover { color: #fff; border-color: #5c5c5c; }

    /* scaled viewport */
    .embed-viewport { position: relative; width: 100%; overflow: hidden; background: var(--panel); }
    .embed-viewport iframe {
      position: absolute; top: 0; left: 0;
      border: 0; display: block; transform-origin: 0 0;
      background: #fff;
    }
    .embed-viewport.is-mobile { background: var(--panel); }
    .embed-viewport.is-mobile iframe {

      box-shadow: 0 0 0 1px var(--panel-line), 0 18px 40px rgba(0,0,0,.45);
    }
    /* iOS Safari has a long history of sizing iframes to their content instead of
       honouring height, which would clip the frame; let the wrapper scroll there. */
    @media (hover: none) {
      .embed-viewport { overflow-y: auto; -webkit-overflow-scrolling: touch; }
    }

    /* click-to-load poster */
    .embed-poster {
      position: absolute; inset: 0; z-index: 2;
      border: none; padding: 0; width: 100%;
      background: var(--panel) center top / cover no-repeat;
      cursor: pointer; display: grid; place-items: center;
      font-family: inherit;
    }
    .embed-poster::after {
      content: ''; position: absolute; inset: 0;
      background: rgba(13,13,13,.55); transition: background .25s;
    }
    .embed-poster:hover::after { background: rgba(13,13,13,.42); }
    .embed-play {
      position: relative; z-index: 1;
      display: inline-flex; align-items: center; gap: 10px;
      padding: 15px 24px;
      background: rgba(255,255,255,.96); color: #0d0d0d;
      font-size: 13px; font-weight: 600; letter-spacing: .2px;
      box-shadow: 0 8px 30px rgba(0,0,0,.35);
      transition: transform .25s;
    }
    .embed-poster:hover .embed-play { transform: translateY(-2px); }

    .embed-foot {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
      margin-top: 14px; font-size: 12px; color: var(--muted);
    }
    .embed-foot a { color: var(--text); text-decoration: none; border-bottom: 1px solid var(--border); }
    .embed-foot a:hover { border-color: var(--text); }
    .embed-fallback { display: none; color: #e8a15d; }
    .embed-shell.is-stalled + .embed-foot .embed-fallback { display: inline; }

    .gallery-title { font-size: clamp(19px, 2vw, 24px); font-weight: 700; letter-spacing: -.6px; margin-bottom: 10px; }
    .gallery-note  { font-size: 14px; color: var(--muted); line-height: 1.7; max-width: 620px; margin-bottom: 20px; }

    /* ── GALLERY ─────────────────────────── */
    .gallery { display: flex; flex-direction: column; gap: 10px; }

    .gallery-video-wrap {
      width: 100%; aspect-ratio: 16/9;
      overflow: hidden; background: #000;
    }
    .gallery-video-wrap iframe { width: 100%; height: 100%; border: none; display: block; }

    .gallery-img-wrap { width: 100%; overflow: hidden; background: var(--bg-alt); }
    .gallery-img { display: block; width: 100%; height: auto; }

    /* ── NOT FOUND ───────────────────────── */
    .not-found {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 60svh; text-align: center; gap: 14px;
    }
    .not-found h2 { font-size: 28px; font-weight: 800; letter-spacing: -1px; color: var(--text); }
    .not-found p  { font-size: 14px; color: var(--muted); }
    .not-found a  { font-size: 13px; font-weight: 600; color: var(--accent-text); text-decoration: none; border-bottom: 1.5px solid var(--accent-text); padding-bottom: 2px; margin-top: 4px; }
  </style>
</head>

    /* The live site runs in a scaled iframe: the frame gets the real desktop
       (or phone) viewport width, then CSS transform shrinks it into whatever
       space the column has, so the site renders its true layout instead of
       reflowing to the container. */
    function initLiveEmbed(em) {
      const VIEWPORTS = {
        desktop: { w: 1440, h: 900, pad: 0 },
        mobile:  { w: 390,  h: 780, pad: 24 }
      };

      const shell    = document.getElementById('embedShell');
      const viewport = document.getElementById('embedViewport');
      const poster   = document.getElementById('embedPoster');
      const tools    = document.getElementById('embedVp');

      let mode   = window.innerWidth < 720 ? 'mobile' : 'desktop';
      let frame  = null;
      let stall  = null;

      function layout() {
        const { w: vw, h: vh, pad } = VIEWPORTS[mode];
        const cw    = viewport.clientWidth;
        const scale = Math.min(1, (cw - pad * 2) / vw);

        viewport.style.height = (vh * scale + pad * 2) + 'px';
        viewport.classList.toggle('is-mobile', mode === 'mobile');

        if (frame) {
          frame.style.width  = vw + 'px';
          frame.style.height = vh + 'px';
          frame.style.transform = `scale(${scale})`;
          frame.style.left = ((cw - vw * scale) / 2) + 'px';
          frame.style.top  = pad + 'px';
        }
      }

      function setMode(next) {
        mode = next;
        tools.querySelectorAll('button').forEach(b =>
          b.setAttribute('aria-pressed', String(b.dataset.vp === next))
        );
        layout();
      }

      function load() {
        if (frame) return;
        frame = document.createElement('iframe');
        frame.src = em.url;
        frame.title = (em.title || 'Live site') + ' preview';
        frame.loading = 'lazy';
        frame.setAttribute('referrerpolicy', 'no-referrer-when-downgrade');
        frame.addEventListener('load', () => {
          clearTimeout(stall);
          shell.classList.remove('is-stalled');
        });
        viewport.appendChild(frame);
        poster.remove();
        layout();
        // no reliable cross-origin signal for a blocked frame, so fall back on time
        stall = setTimeout(() => shell.classList.add('is-stalled'), 12000);
      }

      poster.addEventListener('click', load);
      tools.addEventListener('click', e => {
        const b = e.target.closest('button[data-vp]');
        if (b) setMode(b.dataset.vp);
      });
      window.addEventListener('resize', layout);

      setMode(mode);
    }
